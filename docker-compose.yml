services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prism_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: prism
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - prism_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prism_admin -d prism']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - prism_redis:/data
volumes:
  prism_postgres:
  prism_redis:
