name: PRISM verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prism
          POSTGRES_USER: prism_admin
          POSTGRES_PASSWORD: prism_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prism_admin -d prism"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      MIGRATION_DATABASE_URL: postgresql://prism_admin:prism_ci_only@127.0.0.1:5432/prism
      PRISM_TEST_ADMIN_DATABASE_URL: postgresql://prism_admin:prism_ci_only@127.0.0.1:5432/prism
      PRISM_TEST_DATABASE_URL: postgresql://prism_runtime_test:prism_ci_runtime_only@127.0.0.1:5432/prism
      PRISM_RUNTIME_ROLE: prism_runtime_test
      PRISM_RUNTIME_DB_PASSWORD: prism_ci_runtime_only
      PRISM_TEST_USER_ID: 11111111-1111-4111-8111-111111111111
      PRISM_TEST_SUBJECT: local-development
      PRISM_TEST_REDIS_URL: redis://127.0.0.1:6379
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_PUBLIC_API_URL: https://api.prism.example/api/v1
      EXPO_PUBLIC_DEV_AUTH: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:types && git diff --exit-code -- packages/types/src/api.ts
      - run: pnpm check
      - name: Configure disposable PostgreSQL test fixtures
        run: |
          pnpm db:migrate
          pnpm db:runtime-role
          pnpm exec tsx scripts/setup-ci-database.ts
      - run: pnpm test:postgres
      - run: pnpm verify:restore
        env:
          PRISM_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Validate engineering contracts
        run: |
          python3 -m venv .data/validation
          .data/validation/bin/pip install -r requirements-validation.txt
          .data/validation/bin/python tests/contracts/validate_contract.py
          PRISM_PGLITE_MODULE="$PWD/packages/database/node_modules/@electric-sql/pglite/dist/index.js" node tests/contracts/schema_smoke.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: prism-verification
          path: |
            output/playwright/
            docs/verification/
          if-no-files-found: ignore
